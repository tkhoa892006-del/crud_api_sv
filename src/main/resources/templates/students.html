<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý sinh viên</title>
    <style>
        :root { font-family: Arial, sans-serif; color: #1f2937; background: #f3f4f6; }
        body { margin: 0; padding: 32px 16px; }
        main { max-width: 1100px; margin: auto; background: white; padding: 28px; border-radius: 12px; box-shadow: 0 2px 12px #00000012; }
        h1 { margin-top: 0; color: #166534; }
        .toolbar, .form-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        input, button { border: 1px solid #d1d5db; border-radius: 6px; padding: 9px 12px; font-size: 14px; }
        input { flex: 1 1 160px; }
        button { cursor: pointer; background: #166534; color: white; border: 0; }
        button.secondary { background: #6b7280; }
        button.danger { background: #dc2626; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 11px 8px; border-bottom: 1px solid #e5e7eb; text-align: left; }
        th { background: #f0fdf4; color: #166534; }
        .actions { white-space: nowrap; }
        .actions button { padding: 6px 9px; margin-right: 4px; }
        #message { min-height: 20px; margin-bottom: 12px; color: #166534; }
        @media (max-width: 760px) { main { padding: 18px; overflow-x: auto; } table { min-width: 850px; } }
    </style>
</head>
<body>
<main>
    <h1>Quản lý sinh viên</h1>
    <form class="toolbar" method="get" action="/students">
        <input name="keyword" th:value="${keyword}"
               placeholder="Tìm mã SV, họ tên, email hoặc số điện thoại">
        <button type="submit">Tìm kiếm</button>
        <a href="/students"><button type="button" class="secondary">Tất cả</button></a>
    </form>

    <form id="student-form" class="form-grid">
        <input type="hidden" id="student-id">
        <input id="student-code" placeholder="Mã sinh viên" required>
        <input id="full-name" placeholder="Họ và tên" required>
        <input id="email" type="email" placeholder="Email" required>
        <input id="phone" placeholder="Số điện thoại" required>
        <input id="class-name" placeholder="Lớp">
        <button type="submit" id="save-button">Thêm sinh viên</button>
        <button type="button" id="cancel-button" class="secondary" hidden>Hủy sửa</button>
    </form>
    <div id="message" role="status"></div>

    <table>
        <thead>
        <tr><th>Mã SV</th><th>Họ tên</th><th>Email</th><th>Điện thoại</th><th>Lớp</th><th>Thao tác</th></tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.studentCode}"></td>
            <td th:text="${student.fullName}"></td>
            <td th:text="${student.email}"></td>
            <td th:text="${student.phone}"></td>
            <td th:text="${student.className}"></td>
            <td class="actions">
                <button type="button" class="edit-button"
                        th:attr="data-id=${student.id},data-code=${student.studentCode},data-name=${student.fullName},data-email=${student.email},data-phone=${student.phone},data-class=${student.className}">Sửa</button>
                <button type="button" class="danger delete-button" th:attr="data-id=${student.id}">Xóa</button>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(students)}"><td colspan="6">Không tìm thấy sinh viên.</td></tr>
        </tbody>
    </table>
</main>
<script>
    const form = document.getElementById('student-form');
    const idInput = document.getElementById('student-id');
    const message = document.getElementById('message');
    const saveButton = document.getElementById('save-button');
    const cancelButton = document.getElementById('cancel-button');

    function value(id) { return document.getElementById(id).value.trim(); }
    function showMessage(text, error) { message.textContent = text; message.style.color = error ? '#dc2626' : '#166534'; }
    function resetForm() {
        form.reset(); idInput.value = ''; saveButton.textContent = 'Thêm sinh viên'; cancelButton.hidden = true;
    }
    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const id = idInput.value;
        const response = await fetch(id ? `/api/students/${id}` : '/api/students', {
            method: id ? 'PUT' : 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({studentCode: value('student-code'), fullName: value('full-name'),
                email: value('email'), phone: value('phone'), className: value('class-name')})
        });
        if (!response.ok) { showMessage('Không thể lưu sinh viên.', true); return; }
        window.location.reload();
    });
    cancelButton.addEventListener('click', resetForm);
    document.querySelectorAll('.edit-button').forEach(button => button.addEventListener('click', () => {
        idInput.value = button.dataset.id;
        document.getElementById('student-code').value = button.dataset.code;
        document.getElementById('full-name').value = button.dataset.name;
        document.getElementById('email').value = button.dataset.email;
        document.getElementById('phone').value = button.dataset.phone;
        document.getElementById('class-name').value = button.dataset.class || '';
        saveButton.textContent = 'Cập nhật sinh viên'; cancelButton.hidden = false;
        window.scrollTo({top: 0, behavior: 'smooth'});
    }));
    document.querySelectorAll('.delete-button').forEach(button => button.addEventListener('click', async () => {
        if (!confirm('Bạn có chắc muốn xóa sinh viên này?')) return;
        const response = await fetch(`/api/students/${button.dataset.id}`, {method: 'DELETE'});
        if (!response.ok) { showMessage('Không thể xóa sinh viên.', true); return; }
        window.location.reload();
    }));
</script>
</body>
</html>
